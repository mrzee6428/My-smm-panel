<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber SMM | Next-Gen Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap');
        body { background-color: #020617; color: #f8fafc; font-family: 'Rajdhani', sans-serif; }
        .cyber-header { font-family: 'Orbitron', sans-serif; }
        .neon-text { text-shadow: 0 0 10px #06b6d4, 0 0 20px #06b6d4; }
        .cyber-card { 
            background: linear-gradient(145deg, #0f172a, #020617);
            border: 1px solid #1e293b;
            border-left: 4px solid #06b6d4;
            transition: 0.4s;
        }
        .cyber-card:hover { border-color: #06b6d4; box-shadow: 0 0 20px rgba(6, 182, 212, 0.2); transform: translateY(-3px); }
        .shimmer { background: linear-gradient(90deg, #0f172a 25%, #1e293b 50%, #0f172a 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="antialiased">

    <!-- Nav -->
    <header class="p-5 border-b border-cyan-900/30 bg-slate-950/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded bg-cyan-500/10 border border-cyan-500 flex items-center justify-center">
                    <i class="fa fa-bolt text-cyan-400"></i>
                </div>
                <h1 class="cyber-header text-xl font-bold tracking-tighter text-cyan-400 neon-text">CYBER<span class="text-white">SMM</span></h1>
            </div>
            <a href="https://wa.me/923486175620" class="bg-cyan-600 text-white px-4 py-2 rounded text-[10px] font-bold uppercase tracking-widest shadow-[0_0_15px_rgba(8,145,178,0.4)]">Support</a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-5 pb-24">
        
        <!-- Hero Section -->
        <div class="rounded-3xl bg-slate-900/50 border border-cyan-900/20 p-8 mb-10 text-center relative overflow-hidden">
            <h2 class="cyber-header text-3xl md:text-5xl font-black mb-4 tracking-tight">UPGRADE YOUR SOCIAL</h2>
            <p class="text-slate-400 text-sm max-w-lg mx-auto uppercase tracking-widest">Fastest Social Media Services in Pakistan. 24/7 Execution.</p>
            <div class="mt-6 inline-flex gap-4">
                <div class="bg-cyan-500/5 px-4 py-2 border border-cyan-500/20 rounded">
                    <p class="text-[8px] uppercase text-cyan-500 font-bold leading-none">Currency</p>
                    <p class="font-bold text-lg">PKR (Rs)</p>
                </div>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="relative mb-10 max-w-xl mx-auto">
            <i class="fa fa-search absolute left-4 top-1/2 -translate-y-1/2 text-cyan-500 opacity-50"></i>
            <input type="text" id="serviceSearch" placeholder="SEARCH SERVICES..." 
            class="w-full bg-slate-950 border border-slate-800 p-4 pl-12 rounded focus:border-cyan-500 outline-none transition-all text-sm font-bold uppercase tracking-widest">
        </div>

        <!-- Stats -->
        <div class="flex items-center justify-between mb-6 px-1 border-b border-slate-800 pb-4">
            <h3 class="cyber-header text-[10px] font-bold text-cyan-500 uppercase tracking-[0.3em]">Operational Database</h3>
            <span id="loadInfo" class="text-[9px] font-bold text-white bg-slate-800 px-3 py-1 rounded">CONNECTING...</span>
        </div>

        <!-- Services Grid -->
        <div id="servicesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="shimmer h-32 rounded-xl"></div>
            <div class="shimmer h-32 rounded-xl"></div>
            <div class="shimmer h-32 rounded-xl"></div>
        </div>
    </main>

    <script>
        const API_KEY = '468924646c5a772af2a074aa51db5abb';
        const WHATSAPP = '923486175620';
        const PROFIT_MARGIN = 1.30; // 30% Profit
        const DOLLAR_RATE = 285;   // 1 USD to PKR

        async function loadServices() {
            const container = document.getElementById('servicesList');
            const info = document.getElementById('loadInfo');

            try {
                // Using corsproxy.io for better POST support
                const apiURL = `https://shadowsmmpanel.com/api/v2?key=${API_KEY}&action=services`;
                const proxyURL = `https://corsproxy.io/?${encodeURIComponent(apiURL)}`;

                const response = await fetch(proxyURL);
                const services = await response.json();

                if (!Array.isArray(services)) throw new Error("Format Error");

                container.innerHTML = '';
                info.innerText = `${services.length} SERVICES ONLINE`;

                services.slice(0, 150).forEach(item => {
                    const usdPrice = parseFloat(item.rate);
                    // Price in PKR: (USD Rate * Dollar Rate) + Profit
                    const pkrPrice = Math.ceil((usdPrice * DOLLAR_RATE) * PROFIT_MARGIN);

                    const div = document.createElement('div');
                    div.className = "cyber-card p-5 flex flex-col justify-between group";
                    div.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-3">
                                <span class="text-[8px] font-bold bg-cyan-900/30 text-cyan-400 px-2 py-1 rounded tracking-tighter uppercase">${item.category}</span>
                                <span class="text-[8px] text-slate-600 font-bold italic">#${item.service}</span>
                            </div>
                            <h4 class="text-xs font-bold text-white uppercase leading-tight line-clamp-2">${item.name}</h4>
                        </div>
                        <div class="mt-6 flex justify-between items-end border-t border-slate-800/50 pt-4">
                            <div>
                                <p class="text-[8px] text-slate-500 font-bold uppercase tracking-widest leading-none">Per 1000</p>
                                <p class="text-xl font-black text-cyan-400 leading-none mt-1 italic">Rs. ${pkrPrice}</p>
                            </div>
                            <a href="https://wa.me/${WHATSAPP}?text=I want to order SERVICE ID: ${item.service} (${item.name}) Price: Rs.${pkrPrice}" 
                               class="bg-cyan-600 text-white text-[9px] font-bold px-4 py-2 rounded uppercase tracking-tighter active:scale-90 transition-all">
                               ORDER NOW
                            </a>
                        </div>
                    `;
                    container.appendChild(div);
                });

            } catch (err) {
                console.error(err);
                info.innerText = "OFFLINE MODE";
                container.innerHTML = `
                    <div class="col-span-full text-center py-20 border-2 border-dashed border-slate-800 rounded-3xl">
                        <i class="fa fa-wifi text-slate-800 text-5xl mb-4"></i>
                        <p class="text-slate-500 font-bold uppercase tracking-widest text-xs">Access Restricted by Panel Server</p>
                        <button onclick="location.reload()" class="mt-6 bg-slate-800 text-white px-8 py-2 rounded text-[10px] font-bold uppercase">Try Reconnect</button>
                    </div>
                `;
            }
        }

        // Search Filter
        document.getElementById('serviceSearch').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.cyber-card');
            cards.forEach(card => {
                const title = card.querySelector('h4').innerText.toLowerCase();
                const category = card.querySelector('span').innerText.toLowerCase();
                card.style.display = (title.includes(query) || category.includes(query)) ? 'flex' : 'none';
            });
        });

        window.onload = loadServices;
    </script>
</body>
</html>
