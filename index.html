<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber SMM PANEL | Next-Gen Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');
        
        body { 
            background-color: #050b18; 
            color: #e2e8f0;
            font-family: 'Rajdhani', sans-serif;
        }

        .cyber-header { font-family: 'Orbitron', sans-serif; }
        
        .neon-border {
            border: 1px solid #06b6d4;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
        }

        .cyber-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-left: 4px solid #06b6d4;
            transition: 0.3s;
        }

        .cyber-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
            background: rgba(30, 41, 59, 0.9);
        }

        .glitch-text {
            text-shadow: 2px 2px #ff00ff, -2px -2px #00ffff;
        }

        /* Animation for loading */
        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(6, 182, 212, 0.5);
            position: absolute;
            animation: scan 3s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
</head>
<body class="antialiased">

    <!-- Top Glow -->
    <div class="fixed top-0 left-0 w-full h-1 bg-cyan-500 shadow-[0_0_20px_#06b6d4] z-50"></div>

    <!-- Sidebar / Nav -->
    <header class="p-5 border-b border-cyan-900/50 bg-[#050b18]/80 backdrop-blur-xl sticky top-0 z-40">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full border-2 border-cyan-500 flex items-center justify-center animate-pulse">
                    <i class="fa fa-shuttle-space text-cyan-400"></i>
                </div>
                <h1 class="cyber-header text-xl font-black tracking-tighter text-cyan-400 glitch-text">CYBER<span class="text-white">SMM</span></h1>
            </div>
            <div class="flex items-center gap-4">
                <div class="hidden md:block text-right">
                    <p class="text-[10px] text-cyan-500 font-bold uppercase tracking-widest leading-none">Status</p>
                    <p class="text-xs font-bold text-emerald-400 uppercase">System Online</p>
                </div>
                <a href="https://wa.me/923486175620" class="bg-cyan-600 hover:bg-cyan-500 text-white px-5 py-2 rounded-sm text-xs font-bold uppercase tracking-widest transition-all">WhatsApp Us</a>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-5 pb-20">
        
        <!-- Hero Section -->
        <div class="relative rounded-2xl overflow-hidden mb-12 border border-cyan-900/30">
            <div class="scanline"></div>
            <div class="bg-gradient-to-br from-cyan-950 to-slate-950 p-10 py-16 text-center">
                <h2 class="cyber-header text-4xl md:text-6xl font-black text-white mb-4 uppercase italic">Next Gen Social Panel</h2>
                <p class="text-cyan-400 text-lg font-medium tracking-wide">Boost Your Social Media with Cyber Speed</p>
                <div class="mt-8 flex justify-center gap-4">
                    <div class="bg-cyan-900/30 px-6 py-3 border border-cyan-500/50 rounded-sm">
                        <p class="text-[10px] uppercase font-bold text-cyan-500">Manual Profit</p>
                        <p class="text-xl font-bold">25% Added</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search Area -->
        <div class="relative mb-12 max-w-2xl mx-auto">
            <i class="fa fa-terminal absolute left-4 top-1/2 -translate-y-1/2 text-cyan-500"></i>
            <input type="text" id="serviceSearch" placeholder="SEARCH SERVICE COMMAND..." 
            class="w-full bg-slate-900 border border-cyan-900 px-12 py-4 rounded-sm focus:border-cyan-500 outline-none transition-all text-cyan-100 placeholder:text-cyan-900 font-bold uppercase tracking-widest text-sm shadow-inner">
        </div>

        <!-- Services Content -->
        <div class="flex items-center gap-4 mb-8">
            <h3 class="cyber-header text-xl font-bold text-white uppercase tracking-tighter">Database Services</h3>
            <div class="flex-1 h-[1px] bg-cyan-900/50"></div>
            <span id="serviceCount" class="text-xs font-bold text-cyan-500 tracking-widest">CONNECTING...</span>
        </div>

        <div id="servicesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Loading Skeletons -->
            <div class="h-40 bg-slate-900/50 border border-cyan-900/30 animate-pulse"></div>
            <div class="h-40 bg-slate-900/50 border border-cyan-900/30 animate-pulse"></div>
            <div class="h-40 bg-slate-900/50 border border-cyan-900/30 animate-pulse"></div>
        </div>

    </main>

    <!-- Footer Support -->
    <div class="fixed bottom-6 right-6 z-50">
        <a href="https://wa.me/923486175620" class="w-16 h-16 bg-emerald-500 rounded-full flex items-center justify-center text-white text-2xl shadow-[0_0_20px_#10b981] hover:scale-110 transition-all">
            <i class="fab fa-whatsapp"></i>
        </a>
    </div>

    <script>
        const API_KEY = '468924646c5a772af2a074aa51db5abb';
        const WA_NUMBER = '923486175620';
        const PROFIT_PERCENT = 25; // 25% profit margin

        // Backup static data if API fails
        const backupServices = [
            {service: "1", name: "Instagram Real Followers", category: "Instagram", rate: "120"},
            {service: "2", name: "TikTok Views (Fast)", category: "TikTok", rate: "15"},
            {service: "3", name: "Facebook Page Likes", category: "Facebook", rate: "250"},
            {service: "4", name: "YouTube WatchTime", category: "YouTube", rate: "1200"}
        ];

        async function initCyberPanel() {
            const container = document.getElementById('servicesList');
            const countLabel = document.getElementById('serviceCount');

            try {
                const apiURL = `https://shadowsmmpanel.com/api/v2?key=${API_KEY}&action=services`;
                // Use a different robust proxy for SMM panels
                const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(apiURL)}`;

                const response = await fetch(proxy);
                const result = await response.json();
                const services = JSON.parse(result.contents);

                if (!services || services.error) throw new Error("API Limit");

                container.innerHTML = '';
                countLabel.innerText = `${services.length} COMMANDS LOADED`;

                services.slice(0, 150).forEach(item => {
                    const originalRate = parseFloat(item.rate);
                    // Conversion to PKR (assuming API is USD) + Profit
                    // Let's assume 1 USD = 280 PKR for simplicity, or just use as Rs directly if panel is PKR
                    const salePrice = Math.ceil(originalRate * (1 + PROFIT_PERCENT/100));

                    renderCard(container, item.name, item.category, salePrice, item.min, item.max);
                });

            } catch (err) {
                console.log("Switching to Hybrid Mode...");
                container.innerHTML = '';
                countLabel.innerText = "LOCAL DATABASE";
                backupServices.forEach(item => {
                    renderCard(container, item.name, item.category, item.rate, "100", "10K");
                });
            }
        }

        function renderCard(container, name, cat, price, min, max) {
            const div = document.createElement('div');
            div.className = "cyber-card p-6 rounded-sm relative overflow-hidden group";
            div.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <span class="text-[9px] font-bold text-cyan-500 uppercase tracking-[0.2em] bg-cyan-950 px-2 py-1">${cat}</span>
                    <i class="fa fa-microchip text-cyan-900 group-hover:text-cyan-500 transition-colors"></i>
                </div>
                <h4 class="text-sm font-bold text-white uppercase mb-2 leading-tight h-10 overflow-hidden">${name}</h4>
                <div class="flex justify-between items-end mt-6">
                    <div>
                        <p class="text-[9px] text-slate-500 uppercase font-bold tracking-widest">Rate Per 1k</p>
                        <p class="text-2xl font-black text-cyan-400 tracking-tighter">Rs. ${price}</p>
                    </div>
                    <a href="https://wa.me/${WA_NUMBER}?text=I want to buy SERVICE: ${name.toUpperCase()} (Rate: Rs.${price})" 
                       class="bg-white/5 hover:bg-cyan-600 text-white p-3 px-6 rounded-sm text-[10px] font-bold uppercase tracking-[0.2em] border border-cyan-900 transition-all active:scale-95">
                       EXECUTE
                    </a>
                </div>
                <div class="mt-4 flex gap-4 text-[8px] text-slate-600 font-bold uppercase tracking-widest">
                    <span>Min: ${min}</span>
                    <span>Max: ${max}</span>
                </div>
            `;
            container.appendChild(div);
        }

        // Search Filter
        document.getElementById('searchBox').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.cyber-card');
            cards.forEach(c => {
                const text = c.innerText.toLowerCase();
                c.style.display = text.includes(query) ? 'block' : 'none';
            });
        });

        window.onload = initCyberPanel;
    </script>
</body>
                                                                                                                                                 </html>
